syntax = "proto3";

package protobridge;

message UserInfo {
    uint64 id = 1;
    string username = 2;
    string email = 3;
    int32 age = 4;
    bool is_active = 5;
    int64 timestamp = 6;
    repeated Role roles = 7;
}

enum Role {
    UNSPECIFIED = 0;
    USER = 1;
    ADMIN = 2;
    MODERATOR = 3;
    DEVELOPER = 4;
    QA = 5;
}
